<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Coloropoly Color Toolbox</title>
    <meta
      name="description"
      content="Complete color toolbox for color picking, palette generation and export, image color extract, contrast checker (WCAG / APCA)."
    >
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Coloropoly Color Toolbox">
    <meta
      property="og:description"
      content="Complete color toolbox for color picking, palette generation and export, image color extract, contrast checker (WCAG / APCA)."
    >
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://raw.githubusercontent.com/dcog989/Coloropoly/main/assets/screen-1.webp">
    <meta property="og:image:type" content="image/webp">
    <meta property="og:image:width" content="1969">
    <meta property="og:image:height" content="1819">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#444444">
    <script>
    // Block rendering to apply theme class before any content appears
    (() => {
      try {
        // Check localStorage for saved theme preference
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        } else if (savedTheme === "light") {
          document.documentElement.classList.add("light");
        } else {
          // No saved preference - use system preference
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (prefersDark) {
            document.documentElement.classList.add("dark");
          }
          // Light mode is default (no class needed)
        }
      } catch {
        // localStorage not available - fall back to system preference
        try {
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (prefersDark) {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // Ignore - light mode will be default
        }
      }
    })();
    </script>
    <style>
    /* Critical CSS to prevent FOUC */
    html,
    body {
      background-color: #f6f6f6;
      margin: 0;
      padding: 0;
    }

    html.dark,
    html.dark body {
      background-color: #444;
    }

    /* Prevent layout shift during load.
       No `contain` here: it would make #app the anchor for fixed modals and toasts. */
    #app {
      min-height: 100vh;
    }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
